# Solana golden set.
#
# Ground truth for the rug entries does NOT come from a RugBuster label. Each
# was independently confirmed by tracing the creator's balance on-chain: a
# token counts as a confirmed dump only if the creator's holding collapsed by
# at least 95% from its observed peak. Source: the published
# rugbuster-solana-goplus-benchmark package (2026-08-24), 17 confirmed of 25
# resolved out of a 30-token sample.
#
# Why both paths are tested:
# On 2026-09-07 the cached path caught 17/17 of these while the live path
# scored 16/17 as GOOD with risk 1. A gate that only checked /score would have
# read green, because these addresses are all in the collector cache. Any
# token a user submits that is NOT in cache goes through the live path.
endpoint: https://rugbuster-solana-api-production.up.railway.app/score
rugcheck_api: https://api.rugcheck.xyz/v1/tokens/{address}/report

gates:
  confirmed_rug_forbidden_labels: [GOOD]
  confirmed_rug_all_must_pass: true
  canonical_expected_labels: [GOOD]
  canonical_all_must_pass: true
  # Both the served endpoint and the live scoring path must satisfy the above.
  check_live_path: true

entries:
  # --- canonical mints: must read GOOD on both paths ---
  - symbol: USDC
    address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    category: canonical
    note: >
      Holds mint and freeze authority by design -- Circle must be able to issue
      and to freeze under court order. Scoring that as a rug vector put USDC at
      risk 55 (WARN) on the live path in production until 2026-09-07.
    expected_labels: [GOOD]
    gate: true
  - symbol: USDT
    address: Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB
    category: canonical
    note: Same authority pattern as USDC; was also WARN on the live path.
    expected_labels: [GOOD]
    gate: true
  - symbol: WSOL
    address: So11111111111111111111111111111111111111112
    category: canonical
    note: Wrapped native SOL.
    expected_labels: [GOOD]
    gate: true
  - symbol: BONK
    address: DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263
